        .med-header {

        /* ===== Toggle Switch (Slider) ===== */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;          /* Off = 0 (left) */
            transition: .25s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .25s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #4CAF50;       /* On = 1 (right) */
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* Optional: show 0 / 1 text under the switch */
        .value {
            display: block;
            font-size: 0.7em;
            color: #666;
            margin-top: 3px;
        }
    </style>
</head>
